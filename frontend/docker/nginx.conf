# ============================================================
#  nginx 站点配置（非 root 运行，监听 8080）
#  要点：SPA 路由回退 / gzip 压缩 / WASM 正确 MIME / 分层缓存
# ============================================================
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩：JS / CSS / JSON / SVG / WASM
    # 注意：nginx 1.21.4 起 .js 的默认 MIME 为 text/javascript，两者都要覆盖
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml application/wasm;

    # WASM 的 MIME 已由 /etc/nginx/mime.types 内置（application/wasm），
    # 注意：server 块里再写 types{} 会整体覆盖全局 MIME 映射，切勿添加。

    # 带内容哈希的构建产物：一年长缓存（文件名变即缓存失效）
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 模型（ONNX）与 ORT 运行时（wasm）：内容稳定，按周缓存
    location ~* \.(onnx|wasm|mjs)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # 入口 HTML：禁缓存，保证发版后浏览器立即拿到新版本
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA 路由回退：/history、/jobs 等前端路由直接刷新不 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}
